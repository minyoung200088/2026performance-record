<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20260506 퍼포먼스 기록</title>
    <!-- 구글 폰트 설정 (본문용 및 제목용) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif KR', serif;
            background-color: #fcfcfc;
            color: #333;
            line-height: 1.8;
            word-break: keep-all;
        }

        /* 헤더 영역 */
        header {
            padding: 80px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111;
            line-height: 1.4;
        }

        .meta-info {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 40px;
        }

        .meta-info div {
            margin-bottom: 5px;
        }

        /* 포스터 이미지 영역 (가득 차게) */
        .poster-section {
            width: 100%;
            max-width: 1200px; /* 전체 페이지 최대 너비와 맞춤 */
            margin: 0 auto 60px;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .poster-section img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            /* 은은한 그림자를 넣어 포스터를 강조 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* 본문 설명 영역 */
        .description {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-size: 1.05rem;
            color: #444;
            border-top: 1px solid #eee;
            padding-top: 40px;
        }

        .description-sub {
            color: #888;
            font-size: 0.95rem;
            margin-top: 20px;
        }

        /* 기록 그리드 영역 */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .record-card {
            background: #fff;
            overflow: hidden;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #eee;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .record-text {
            font-size: 0.9rem;
            color: #555;
            padding: 10px 0;
            border-top: 1px solid #f0f0f0;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 100px 0 50px;
            font-size: 0.8rem;
            color: #aaa;
            border-top: 1px solid #eee;
        }

        /* 반응형 설정 */
        @media (max-width: 600px) {
            .title { font-size: 1.4rem; }
            .archive-grid { grid-template-columns: 1fr; }
            header { padding: 40px 20px; }
        }
    </style>
</head>
